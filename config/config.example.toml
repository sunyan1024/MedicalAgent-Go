# Copy to config/config.toml and fill in local credentials. Never commit the local config.
[mainConfig]
appName = "GoAI"
host = "127.0.0.1"
port = 9090

[adminConfig]
# 三项全部留空时跳过初始化；填齐后启动创建管理员，已有账号不会重置密码。
uid = ""
email = ""
password = ""

[emailConfig]
authcode = ""
email = ""

[redisConfig]
host = "127.0.0.1"
port = 6379
password = ""
db = 0

[mysqlConfig]
host = "127.0.0.1"
port = 3306
user = "root"
password = ""
databaseName = "GoAI"
charset = "utf8mb4"

[rabbitmqConfig]
host = "127.0.0.1"
port = 5672
username = "guest"
password = ""
vhost = "/"

[jwtConfig]
expire_duration = 168
issuer = "sy"
subject = "GoAI"
key = ""

[QwenConfig]
api_key = ""
baseurl = "https://dashscope.aliyuncs.com/compatible-mode/v1"
modelname = "qwen3.7-flash-2026-07-15"
